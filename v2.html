<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ATAOL v2</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Outfit:wght@300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-v2.css">
</head>
<body>
    <div id="app">
        <main id="view-routine" class="v2-view active"></main>
        <main id="view-parent" class="v2-view"></main>
        <main id="view-games" class="v2-view"></main>

        <nav class="v2-nav">
            <button type="button" class="active" data-nav="routine">
                <span class="material-symbols-rounded">checklist</span>
                <span>Rutin</span>
            </button>
            <button type="button" data-nav="parent">
                <span class="material-symbols-rounded">family_restroom</span>
                <span>Ebeveyn</span>
            </button>
            <button type="button" data-nav="games">
                <span class="material-symbols-rounded">sports_esports</span>
                <span>Oyun</span>
            </button>
        </nav>

        <div id="pin-modal" class="v2-modal" hidden>
            <div class="v2-modal__box">
                <h2>Ebeveyn Onayı</h2>
                <div id="pin-guardians"></div>
                <input type="password" inputmode="numeric" maxlength="8" id="pin-input" placeholder="PIN">
                <p id="pin-error" class="v2-modal__error" hidden>PIN yanlış, tekrar dene.</p>
                <div class="v2-modal__actions">
                    <button type="button" id="pin-cancel">Vazgeç</button>
                    <button type="button" id="pin-submit">Onayla</button>
                </div>
            </div>
        </div>

        <div id="guardian-modal" class="v2-modal" hidden>
            <div class="v2-modal__box">
                <p id="guardian-modal__title">Bakım veren ekle</p>
                <input type="text" id="guardian-name" placeholder="İsim" autocomplete="off">
                <input type="text" id="guardian-label" placeholder="Nasıl görünsün (örn. Feride mama)" autocomplete="off">
                <input type="password" id="guardian-pin" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off">
                <input type="password" id="guardian-pin2" inputmode="numeric" maxlength="8" placeholder="PIN tekrar" autocomplete="off">
                <div id="guardian-gate" hidden>
                    <p class="v2-modal__note">Yeni bakım veren eklemek için mevcut bir PIN gerekiyor.</p>
                    <div id="guardian-gate-list"></div>
                    <input type="password" id="guardian-gate-pin" inputmode="numeric" maxlength="8" placeholder="Mevcut PIN" autocomplete="off">
                </div>
                <p id="guardian-error" class="v2-modal__error" hidden></p>
                <button type="button" id="guardian-submit">Ekle</button>
                <button type="button" id="guardian-cancel">Vazgeç</button>
            </div>
        </div>

        <div id="timequiz-modal" class="v2-modal" hidden>
            <div class="v2-modal__box">
                <p id="timequiz-progress" class="v2-modal__note"></p>
                <p id="timequiz-prompt" class="timequiz__prompt"></p>
                <div id="timequiz-options" class="timequiz__options"></div>
                <p id="timequiz-feedback" class="timequiz__feedback" hidden></p>
                <button type="button" id="timequiz-cancel">Kapat</button>
            </div>
        </div>

        <div id="drill-modal" class="v2-modal" hidden>
            <div class="v2-modal__box">
                <p id="drill-progress" class="v2-modal__note"></p>
                <p id="drill-question" class="drill__question"></p>
                <p id="drill-input" class="drill__input"></p>
                <div id="drill-pad" class="drill__pad"></div>
                <p id="drill-feedback" class="drill__feedback" hidden></p>
                <div id="drill-celebrate" class="drill__celebrate" hidden>
                    <span class="drill__celebrate-star">⭐</span>
                    <p class="drill__celebrate-title">Yeni seviyeye geçtin!</p>
                    <p id="drill-celebrate-level" class="drill__celebrate-level"></p>
                </div>
                <button type="button" id="drill-cancel">Kapat</button>
            </div>
        </div>

        <div id="amiral-modal" class="v2-modal" hidden>
            <div class="v2-modal__box v2-modal__box--wide">
                <p id="amiral-durum" class="v2-modal__note"></p>
                <div id="amiral-tahta" class="amiral__tahta"></div>
                <p id="amiral-mesaj" class="amiral__mesaj" hidden></p>
                <button type="button" id="amiral-yeni">Yeni oyun</button>
                <button type="button" id="amiral-kapat">Kapat</button>
            </div>
        </div>
        <div id="satranc-modal" class="v2-modal" hidden>
            <div class="v2-modal__box v2-modal__box--wide">
                <div id="satranc-secim" class="satranc__secim">
                    <p class="satranc__baslik">Hangi taşı öğrenelim?</p>
                    <div id="satranc-taslar" class="satranc__taslar"></div>
                    <p id="satranc-mujde" class="satranc__mujde" hidden></p>
                </div>

                <div id="satranc-soru" class="satranc__soru" hidden>
                    <p id="satranc-kural" class="satranc__kural"></p>
                    <p id="satranc-gorev" class="satranc__gorev"></p>
                    <div id="satranc-tahta" class="satranc__tahta"></div>
                    <p id="satranc-geribildirim" class="satranc__geribildirim" hidden></p>
                    <button type="button" id="satranc-devam">Yeni soru</button>
                    <button type="button" id="satranc-taslara">Taşlara dön</button>
                </div>

                <button type="button" id="satranc-kapat">Kapat</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
